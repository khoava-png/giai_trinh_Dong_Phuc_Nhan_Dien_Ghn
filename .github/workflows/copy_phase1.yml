# GitHub Actions: Tu dong copy Phieu Phase_1 vao file nhap
name: "Copy Phase_1 Vao File Nhap"

on:
  schedule:
    - cron: "0 23 * * *"  # 6:00 AM VN
  workflow_dispatch:

jobs:
  copy-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        run: pip install gspread google-auth

      - name: "Create credentials file"
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/ghn_creds.json
          echo "[OK] Credentials file size: $(wc -c < /tmp/ghn_creds.json) bytes"

      - name: "Run copy script"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/ghn_creds.json
        run: python scratch/cloud_demo/demo_copy.py

      - name: "Cleanup"
        if: always()
        run: rm -f /tmp/ghn_creds.json
