<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHN Dashboard — Tạm dừng phục vụ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 36px 32px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px 0; color: #fbbf24; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⏸️</div>
    <h1>Dashboard đang tạm dừng phục vụ</h1>
    <p>Hệ thống giám sát phiếu tồn GHN hiện đang tạm đóng hoặc bảo trì theo yêu cầu của Quản trị viên.<br>Vui lòng quay lại sau.</p>
  </div>
</body>
</html>
